 * Every second you stand ALONE on the icy top scores a point. Most points when time runs out wins.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ game length, movement, the shove, the hill's size
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SCENE ......... renderer, sky, snowfall, particles, sounds

 *   SNOW BUDDIES .. the player model: hat, scarf, pushing arms, name tags, the king's crown
 *   PHYSICS ....... walking, sliding down the slope, getting shoved (same code for you and bots)
 *   GAME (HOST) ... the clock, who is king, points, every shove, the bots. Only the host writes these.
 *   ME ............ your snow buddy. Each player writes only its own.
 *   HUD & RESULTS . timer, who's king, scores, results card, leaderboard
 *   INPUT ......... keyboard, touch stick and Shove button
 *

 *   - Each player writes its OWN entity: `p` (one packed JSON field: game id, position,
 *     velocity, heading, animation) about 15 times a second, `hb` (heartbeat) once a
 *     second, and `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `game` (id, v, phase,
 *     clock, scores, who is king right now, the winner) and `bots`. A new host adopts both
 *     and carries on with the same clock and scores.
 *   - Shoves are HOST-RUN: a player who shoves sends "shove" {x, y, z, h}; the host finds
 *     who is in front of it (its own view: the bots, itself, everyone else at their latest
 *     position) and sends "knock" {to, vx, vy, vz} for each. The player named sets its own
 *     speed; everyone shows the hit. The host's own shoves skip the message.
 *   - Points are HOST-RUN too: each second the host checks who is on the top. Exactly one =
 *     that player scores; more than one = contested, nobody scores.
 *   - "again" asks the host to start the next game sooner.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).

}

// ── ME ──────────────────────────────────────────────────────────────────────────────
let myName = "", myColor = COLORS[0]; // the color is picked on join: the first one nobody has
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
if (!myName) myName = ["Frosty", "Chilly", "Snowy", "Lucky", "Jolly", "Brave"][Math.floor(Math.random() * 6)] + " " + ["Mitten", "Boots", "Penguin", "Flake", "Muffin"][Math.floor(Math.random() * 5)];
const me = { ...newBody(), lastSend: 0, lastJson: "", view: null };
const local = { gameId: -1, bigUntil: 0, big: "", shake: 0, lastBeep: 0, king: "", myScore: 0, popUntil: 0 };
const nameOf = (id) => (id === net.sessionId ? myName : isBot(id) ? host.bots.get(id)?.name || "Bot" : S.entities.players[id]?.n || "Player");
const colorOf = (id) => (id === net.sessionId ? myColor : isBot(id) ? host.bots.get(id)?.color || "#ccc" : S.entities.players[id]?.c || "#ccc");
const remotes = new Map(); // id -> { raw, p, at }: everyone's latest `p`, and when it arrived (on our clock)
function remoteOf(id) {
  const raw = S.entities.players[id]?.p; if (typeof raw !== "string") return null;
  let r = remotes.get(id);
  if (!r || r.raw !== raw) { const p = parse(raw, null); if (!p) return null; r = { raw, p, at: performance.now() }; remotes.set(id, r); }
  return r;
}
let botsSeen = { raw: "", at: 0 };

/** Things everyone notices in state: a new game (back to the edge), a new king, my points going up. */
function watchState(g) {
  if (g.id !== local.gameId) {
    local.gameId = g.id; local.myScore = g.score[net.sessionId] || 0; $("over").hidden = true;
    const i = g.order.indexOf(net.sessionId), sp = spawnAt(i >= 0 ? i : Math.floor(Math.random() * 8), i >= 0 ? g.order.length : 8);
    Object.assign(me, sp, { vx: 0, vy: 0, vz: 0, stun: 0, onGround: true }); me.y = groundY(me.x, me.z);
    for (const v of views.values()) v.fresh = true;
  }
  const mine = g.score[net.sessionId] || 0;
  if (mine > local.myScore) { $("pop").textContent = `+${mine - local.myScore}`; $("pop").classList.add("on"); local.popUntil = performance.now() + 250; sfx("point"); burst(me.x, me.y + 1.6, me.z, "#ffd23f", 10, 4); }
  local.myScore = mine;
  if (performance.now() > local.popUntil) $("pop").classList.remove("on");
  if (g.king !== local.king) {
    if (g.king === net.sessionId) bigText("<small>Hold it alone to score</small>YOU'RE KING!", 1300);
    local.king = g.king;
  }
}
function myTick(dt, g) {
  const waiting = g.phase === "play" && Date.now() < g.startAt;
  const inp = waiting ? { mx: 0, mz: 0, shove: false } : ATTRACT ? botBrain(me, net.sessionId, hostBodies(g)) : readInput();
  if (stepBody(me, inp.mx, inp.mz, inp.shove, dt) && g.phase === "play") {
    if (isHost()) resolveShove(g, net.sessionId, me.x, me.y, me.z, me.h);
    else { const r2 = (v) => Math.round(v * 100) / 100; net.send("shove", { x: r2(me.x), y: r2(me.y), z: r2(me.z), h: r2(me.h) }); }
  }
  separate(me, [...views.values()].filter((v) => v.g.visible));
  publish(g.id);
}
function publish(k) {
  const now = performance.now();
  if (now - me.lastSend < 66) return; // ~15/s
  me.lastSend = now;
  const r2 = (v) => Math.round(v * 100) / 100;
  const json = JSON.stringify({ k, x: r2(me.x), y: r2(me.y), z: r2(me.z), vx: r2(me.vx), vz: r2(me.vz), h: r2(me.h), a: me.a });
  if (json !== me.lastJson) { me.lastJson = json; net.me.set("p", json); } // standing still sends nothing
}
/** A shove hit someone: puff and thump for everyone; if it's me, off I go. */
function knockFx(m) {
  if (m.to === net.sessionId && !isHost()) knock(me, +m.vx, +m.vy, +m.vz);
  burst(m.x, m.y + 1, m.z, "#ffffff", 14, 6, 0.8); burst(m.x, m.y + 1.4, m.z, "#ffd23f", 5, 4, 1);
  if (m.to === net.sessionId) local.shake = 0.6;
  if (Math.hypot(m.x - camLook.x, m.z - camLook.z) < 16) sfx("thump", m.to === net.sessionId ? 1 : 0.5);
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const bigText = (html, ms) => { local.big = html; local.bigUntil = performance.now() + ms; };
let board = null, boardFor = -1;
const startedAt = performance.now();
function hud(g) {
  const now = Date.now(), toGo = (g.startAt - now) / 1000;
  const nm = (id) => (id === net.sessionId ? "You" : g.roster.some((r) => r[0] === id) ? rosterName(g, id) : nameOf(id));
  let big = performance.now() < local.bigUntil ? local.big : "";
  if (g.phase === "play" && toGo > 0) big = toGo > 3 ? "<small>Get to the top!</small>KING OF THE HILL" : String(Math.ceil(toGo));
  else if (g.phase === "play" && toGo > -0.8) big = "GO!";
  if (g.phase === "play" && toGo > 0 && toGo <= 3 && Math.ceil(toGo) !== local.lastBeep) { local.lastBeep = Math.ceil(toGo); sfx("beep"); }
  if (g.phase === "play" && toGo <= 0 && local.lastBeep > 0) { local.lastBeep = 0; sfx("go"); }
  $("big").innerHTML = ATTRACT || !big ? "" : `<div>${big}</div>`; // one block, so the small line sits right above the big one
  if (ATTRACT) { $("top").textContent = $("msg").textContent = $("net").textContent = $("ranks").textContent = ""; return; }
  const secs = Math.max(0, Math.ceil((g.endsAt - now) / 1000)), clock = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
  const k = g.king, mine = k === net.sessionId;
  $("top").className = mine ? "hud king" : "hud";
  $("top").innerHTML = g.phase === "results" ? "" : `${!k ? "Nobody's on top" : k === "*" ? "Contested! Nobody scores" : mine ? "👑 You're king! +1 every second" : `👑 ${esc(nm(k))} is king`}<small>${clock} left</small>`;
  $("msg").textContent = performance.now() - startedAt < 15000 && g.phase === "play" ? (touchUI ? "Drag to move · tap SHOVE · stand alone on the top to score!" : "Move with WASD · Space to shove · stand alone on the top to score!") : "";
  const ids = [...new Set([...g.order, ...livePlayers(), ...Object.keys(g.score)])].filter((id) => isBot(id) ? botList().some((b) => b.i === id) || g.score[id] : id === net.sessionId || livePlayers().includes(id) || g.score[id]);
  ids.sort((a, b) => (g.score[b] || 0) - (g.score[a] || 0));
  $("ranks").innerHTML = g.phase === "results" ? "" : ids.slice(0, 8).map((id) => `<div class="${id === net.sessionId ? "me" : ""}"><i style="background:${esc(rosterColor(g, id))}"></i>${esc(nm(id))}${id === k ? " 👑" : ""}<b>${g.score[id] || 0}</b></div>`).join("");
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the hill" : ""}`;
  $("over").hidden = !(g.phase === "results" && now - g.endedAt > 1500);
  if (g.phase === "results") results(g, now, nm);
}
function results(g, now, nm) {
  const mine = g.score[net.sessionId] || 0;
  $("title").textContent = g.win === net.sessionId ? `You're the king! ${mine} points 👑` : g.win ? `${nm(g.win)} is the king! 👑` : "It's a tie!";
  const order = [...new Set([...g.roster.map((r) => r[0]), ...Object.keys(g.score)])].sort((a, b) => (g.score[b] || 0) - (g.score[a] || 0));
  $("results").innerHTML = order.slice(0, 10).map((id) => `<li class="${id === net.sessionId ? "me" : ""}">${esc(nm(id))}${id === g.win ? " 👑" : ""}<span>${g.score[id] || 0} pts</span></li>`).join("");
  $("next").textContent = `Next game in ${Math.max(0, Math.ceil((g.endsAt - now) / 1000))}s`;
  if (boardFor !== g.id) { boardFor = g.id; showBoard(mine); if (g.win === net.sessionId) sfx("win"); }
}
function showBoard(score) {
  const list = $("board");
  if (!board) { list.innerHTML = '<li class="note">Leaderboards need a connection.</li>'; return; } // status lines are not numbered entries
  list.innerHTML = '<li class="note">Loading…</li>';
  (score > 0 ? board.submit(score).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} pts</span></li>`).join("") : '<li class="note">No scores yet. Be the first.</li>';
  }).catch(() => { list.innerHTML = '<li class="note">Couldn\'t load the leaderboard.</li>'; });
}
$("again").onclick = () => { const g = game(); if (!g || g.phase !== "results") return; if (isHost()) playAgain(g); else net.send("again", {}); $("over").hidden = true; };
const playAgain = (g) => { if (g.phase === "results") writeGame({ ...g, endsAt: Math.min(g.endsAt, Date.now() + 1200) }); };
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId
 *  picks again. A bot wearing my color makes me pick again too (the host only recolors bots between games). */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), botColors = botList().map((b) => b.c);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !botColors.includes(myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botColors]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
  if (me.view) recolor(me.view, myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("shove").hidden = !touchUI;
const keys = new Set(), stick = { id: -1, x: 0, y: 0, mx: 0, mz: 0 };
let shoveAt = 0;
addEventListener("keydown", (e) => {
  unlockAudio(); keys.add(e.key.toLowerCase());
  if (e.key === " " || e.key === "Shift") { e.preventDefault(); shoveAt = performance.now(); }
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); Object.assign(stick, { id: -1, mx: 0, mz: 0 }); $("stick").hidden = true; }); // tabbed away: nothing stays held
function readInput() {
  const k = (a, b) => (keys.has(a) || keys.has(b) ? 1 : 0);
  const mx = k("d", "arrowright") - k("a", "arrowleft") + stick.mx, mz = k("s", "arrowdown") - k("w", "arrowup") + stick.mz;
  return { mx, mz, shove: performance.now() - shoveAt < 150 };
}
const cv = renderer.domElement;
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  unlockAudio();
  if (e.pointerType === "mouse" || stick.id >= 0) return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  Object.assign(stick, { id: e.pointerId, x: e.clientX, y: e.clientY, mx: 0, mz: 0 });
  Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerId !== stick.id) return;
  const dx = e.clientX - stick.x, dy = e.clientY - stick.y, d = Math.hypot(dx, dy), k = Math.min(1, d / 50) / (d || 1);
  stick.mx = dx * k; stick.mz = dy * k;
  $("stick").firstElementChild.style.transform = `translate(${stick.mx * 35}px, ${stick.mz * 35}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerId === stick.id) { Object.assign(stick, { id: -1, mx: 0, mz: 0 }); $("stick").hidden = true; } });
const sb = $("shove");
sb.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); shoveAt = performance.now(); sb.classList.add("on"); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) sb.addEventListener(ev, () => sb.classList.remove("on"));
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const camPos = new THREE.Vector3(0, 16, 24), camLook = new THREE.Vector3(0, H, 0);
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the hill meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt); else host.wasHost = false;
  const g = game();
  if (g) { watchState(g); myTick(dt, g); drawWorld(dt, g, now); }
  drawScenery(dt, now);
  renderer.render(scene, camera);
  if (g && now - lastHud > 100) { lastHud = now; hud(g); }
  sb.classList.toggle("wait", me.shoveCd > 0);
}
function drawWorld(dt, g, now) {
  const seen = new Set(), pnow = performance.now(), live = livePlayers();
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.includes(id)) continue;
    const r = remoteOf(id);
    if (!r || r.p.k !== g.id) continue;
    seen.add(id);
    if (!views.has(id)) views.set(id, makeBuddy(p.c || "#ccc", p.n || "Player"));
    const v = views.get(id), age = Math.min(0.12, (pnow - r.at) / 1000);
    recolor(v, p.c || "#ccc");
    drawBuddy(v, r.p.x + r.p.vx * age, r.p.y, r.p.z + r.p.vz * age, r.p.h, r.p.a, dt, true);
  }
  const hosting = isHost(), raw = S.shared.bots;
  if (!hosting && raw !== botsSeen.raw) botsSeen = { raw, at: pnow };
  const age = hosting ? 0 : Math.min(0.12, (pnow - botsSeen.at) / 1000);
  for (const b of botList()) {
    seen.add(b.i);
    if (!views.has(b.i)) views.set(b.i, makeBuddy(b.c, b.n));
    const v = views.get(b.i); recolor(v, b.c);
    drawBuddy(v, b.x + (b.vx || 0) * age, b.y, b.z + (b.vz || 0) * age, b.h, b.a, dt, !hosting);
  }
  const champ = g.phase === "results" ? g.win : g.king;
  for (const [id, v] of views) { if (!seen.has(id)) hideBuddy(v); v.crown.visible = champ === id; }
  if (!me.view) me.view = makeBuddy(myColor, "");
  drawBuddy(me.view, me.x, me.y, me.z, me.h, me.a, dt, false);
  me.view.crown.visible = champ === net.sessionId;
  // the icy top and the floating crown show the king's color; red flashes when it's contested
  const kc = g.king && g.king !== "*" ? rosterColor(g, g.king) : null;
  hill.topMat.emissive.set(g.king === "*" ? (Math.sin(now / 90) > 0 ? "#5a1010" : "#000000") : kc || "#000000"); hill.topMat.emissiveIntensity = kc ? 0.35 : 1;
  hill.crown.rotation.y = now / 1200; hill.crown.position.y = H + 5 + Math.sin(now / 500) * 0.25;
  hill.crownMat.emissive.set(kc || "#7a5200");
  if (champ && champ !== "*" && Math.random() < dt * 6) { const w = champ === net.sessionId ? me.view : views.get(champ); if (w) burst(w.x, w.y + 1.9, w.z, g.phase === "results" ? COLORS[Math.floor(Math.random() * COLORS.length)] : "#ffd23f", g.phase === "results" ? 8 : 2, 3, 1); }
  // camera: behind and above me, leaning toward the hill so the top stays in view; ?attract circles the hill
  if (ATTRACT) {
    const a = now / 9000;
    camPos.set(Math.sin(a) * 9.5, H + 10.5, Math.cos(a) * 9.5); camera.position.lerp(camPos, 0.05); camLook.set(0, H - 0.6, 0);
  } else {
    // look at the point halfway between me and the top, from further back the further out I am
    const far = (camera.aspect < 1 ? 1.2 + 0.4 / Math.max(0.45, camera.aspect) : 1) * (0.75 + 0.25 * Math.min(1, Math.hypot(me.x, me.z) / 14));
    const fx = me.x * 0.5, fz = me.z * 0.5, fy = me.y * 0.5 + 1;
    camPos.set(fx, fy + 20 * far, fz + 13 * far * (camera.aspect < 1 ? 0.7 : 1)); camLook.set(fx, fy, fz); // steep enough that the hill never hides you
    camera.position.lerp(camPos, 1 - Math.pow(0.02, dt));
  }
  local.shake *= Math.exp(-dt * 6);
  camera.lookAt(camLook);
  if (local.shake > 0.01) camera.position.add(v3.set((Math.random() - 0.5) * local.shake, (Math.random() - 0.5) * local.shake, 0));
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("shove", (m, from) => { if (isHost() && m && typeof m === "object") onShove(m, from); });
  net.on("knock", (m) => { if (m && typeof m === "object") knockFx(m); });
  net.on("again", () => { const g = game(); if (isHost() && g) playAgain(g); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 8, startMs: 400, gameMs: 40000, resultsMs: 2500 });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
